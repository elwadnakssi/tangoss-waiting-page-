<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tangoss – قريباً</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #FFD700;
      --pink: #FF3E8A;
      --purple: #6C00FF;
      --teal: #00E5C5;
      --dark: #0A0015;
      --card: rgba(255,255,255,0.05);
    }

    html, body {
      min-height: 100%;
      background: var(--dark);
      font-family: 'Cairo', sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    /* ─── CONFETTI ─── */
    .confetti-wrap {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .dot {
      position: absolute;
      top: -20px;
      border-radius: 50%;
      animation: fall linear infinite;
      opacity: 0.8;
    }
    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg);   opacity: .9; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ─── SPOTLIGHT BG ─── */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(108,0,255,.35) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(255,62,138,.3) 0%, transparent 70%),
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,229,197,.12) 0%, transparent 80%);
    }

    /* ─── LAYOUT ─── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem 1rem 3rem;
      gap: 2rem;
      text-align: center;
    }

    /* ─── LOGO ─── */
    .logo {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.4rem, 8vw, 5rem);
      background: linear-gradient(135deg, var(--gold) 0%, var(--pink) 50%, var(--teal) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: shimmer 3s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 24px rgba(255,215,0,.45));
    }
    @keyframes shimmer {
      from { filter: drop-shadow(0 0 18px rgba(255,62,138,.5)); }
      to   { filter: drop-shadow(0 0 32px rgba(0,229,197,.6)); }
    }

    /* ─── SVG PARTY ILLUSTRATION ─── */
    .illustration {
      width: min(340px, 90vw);
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 16px 40px rgba(108,0,255,.5));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    /* ─── HEADLINE ─── */
    .headline {
      font-size: clamp(1.5rem, 5vw, 2.6rem);
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: -0.5px;
      animation: slideUp .8s ease both;
    }
    .headline span { color: var(--gold); }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── TAGLINE ─── */
    .tagline {
      font-size: clamp(.95rem, 2.5vw, 1.2rem);
      color: rgba(255,255,255,.7);
      max-width: 500px;
      line-height: 1.8;
      animation: slideUp .9s .15s ease both;
    }

    /* ─── BADGE ─── */
    .badge {
      display: inline-flex; align-items: center; gap: .5rem;
      background: rgba(255,215,0,.12);
      border: 1.5px solid rgba(255,215,0,.4);
      border-radius: 999px;
      padding: .45rem 1.2rem;
      font-size: .9rem; font-weight: 700; color: var(--gold);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,.3); }
      50%      { box-shadow: 0 0 0 10px rgba(255,215,0,0); }
    }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }

    /* ─── CONTACT CARDS ─── */
    .contacts {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem;
      animation: slideUp 1s .3s ease both;
      width: 100%; max-width: 740px;
    }
    .contact-card {
      display: flex; align-items: center; gap: .75rem;
      background: var(--card);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 1rem;
      padding: .95rem 1.4rem;
      text-decoration: none; color: #fff;
      font-size: .85rem; font-weight: 600;
      backdrop-filter: blur(12px);
      transition: transform .25s, border-color .25s, box-shadow .25s;
      flex: 1 1 180px; min-width: 170px; max-width: 320px;
    }
    .contact-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,.35);
      box-shadow: 0 12px 32px rgba(0,0,0,.35);
    }
    .contact-card .icon {
      width: 40px; height: 40px; border-radius: .75rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 1.25rem;
    }
    .wa  .icon { background: rgba(37,211,102,.2); color: #25D366; }
    .tel .icon { background: rgba(0,229,197,.2);  color: var(--teal); }
    .em  .icon { background: rgba(255,62,138,.2); color: var(--pink); }
    .contact-card .label { font-size: .82rem; opacity: .55; display: block; }

    /* ─── FOOTER ─── */
    footer {
      font-size: .78rem; color: rgba(255,255,255,.3);
      animation: slideUp 1s .5s ease both;
    }
  </style>
</head>

<script>
  // Generate confetti dots
  const wrap = document.getElementById('confetti');
  const colors = ['#FFD700','#FF3E8A','#6C00FF','#00E5C5','#fff','#ff6eb0'];
  for (let i = 0; i < 55; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    const size = Math.random() * 9 + 4;
    d.style.cssText = `
      left:${Math.random()*100}%;
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${Math.random()*8+5}s;
      animation-delay:${Math.random()*6}s;
      border-radius:${Math.random()>.5?'50%':'3px'};
      opacity:${Math.random()*.6+.3};
    `;
    wrap.appendChild(d);
  }
</script>
